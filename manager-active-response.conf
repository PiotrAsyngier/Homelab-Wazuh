<!-- Wycinek z pliku /var/ossec/etc/ossec.conf na Wazuh Managerze (SOAR / Active Response) -->
<ossec_config>

  <!-- Definicja komendy dla stacji Windows -->
  <command>
    <name>quarantine_mimi</name>
    <executable>quarantine-mimi.cmd</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <!-- Reakcja 1: Blokada IP w iptables na Linuksie po ataku Brute-Force SSH (Regula 100002) -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100002</rules_id>
    <timeout>600</timeout>
  </active-response>

  <!-- Reakcja 2: Zatrzymanie procesu i kwarantanna pliku Mimikatz (Regula 100005) -->
  <active-response>
    <disabled>no</disabled>
    <command>quarantine_mimi</command>
    <location>local</location>
    <rules_id>100005</rules_id>
  </active-response>

</ossec_config>
